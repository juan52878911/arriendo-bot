# Cómo se puntúa por defecto. Se relee en cada inmueble: cambiar un valor no exige reiniciar nada.
# Tus criterios (destino, presupuesto, barrios, pesos) van en config/privado.yaml, que no va al
# repositorio: lo que pongas ahí reemplaza estas secciones (plantilla en config/privado.ejemplo.yaml).

destino:                          # adonde vas a diario; el tiempo en transporte público se mide hasta aquí
  nombre: Plaza de Bolívar
  lat: 4.5981
  lon: -74.0760

busqueda:
  canon_total_max: 3000000        # arriendo + administración
  habitaciones_min: 2
  banos_min: 1
  tiempo_max_min: 60              # puerta a puerta al destino (Transitous)
  localidades_excluidas: []       # nombres como los publica la Secretaría de Seguridad, p. ej. LOS MARTIRES
  # Palabras que delatan que una "habitación" no lo es.
  habitacion_falsa: [estudio, "cuarto de servicio", "alcoba de servicio"]

zonas_preferidas:
  # Sectores catastrales (≈ barrios). Coincidencia sin tildes y por prefijo:
  # "SANTA BARBARA" incluye SANTA BARBARA OCCIDENTAL.
  sectores: []
  # Medio punto si cae en una de estas localidades aunque no en un barrio de la lista.
  localidades: []

pesos:                            # suman 100
  seguridad: 15
  aire_ruido: 10                  # PM2.5 (SDA), ruido nocturno (mapa de ruido), vías principales y señales de tranquilidad
  servicios: 5                    # planta eléctrica, tanque de reserva, fibra, antigüedad del edificio
  estabilidad: 5                  # hogares que llegan al barrio cada año (Encuesta Multipropósito)
  zona: 10
  tiempo: 15
  fotos: 5                        # lo que el servicio de visión ve en las fotos (config/vision.yaml)
  precio_m2: 10
  area: 5
  estrato: 5
  cocina: 5
  amenidades: 5
  entorno: 5                      # parque grande cerca, supermercados o plaza de mercado
  transporte: 0                   # ya lo mide el tiempo al destino
  luz: 0                          # palabras sobre luz; las fotos ya lo miden

parametros:
  area_min_m2: 55                 # 0 puntos de área
  area_buena_m2: 75               # puntaje completo de área
  tiempo_ideal_min: 25
  estratos: {"1": 0.0, "2": 0.3, "3": 1.0, "4": 1.0, "5": 0.5, "6": 0.2}
  tm_buena_m: 400                 # estación troncal a esta distancia o menos: puntaje completo
  tm_lejos_m: 1500
  muestra_min_precio: 5           # inmuebles vistos en la zona para comparar precio/m²
  estafa_ratio: 0.6               # por debajo de 0,6 veces la mediana de la zona: posible estafa
  pm25_bueno: 12                  # µg/m³ promedio anual; la guía de la OMS es 5 y Bogotá va de 11 a 30
  pm25_malo: 25
  ruido_bueno_db: 50              # ruido nocturno en dB(A)
  ruido_malo_db: 65
  via_encima_m: 30                # a menos de esto de una vía principal: alerta "sobre la avenida"
  via_cerca_m: 50                 # 0 puntos de aire y ruido
  via_lejos_m: 250                # puntaje completo
  parque_min_m2: 20000            # parques de 2 ha o más
  parque_cerca_m: 300
  parque_lejos_m: 1200
  mercado_radio_m: 600
  siniestros_alerta: 100          # en 150 m entre 2015 y 2021; 30-80 es lo normal en Bogotá

palabras:
  cocina: [horno, "gas natural", gas, extractor, "cocina integral", meson, mesón, "cocina abierta"]
  amenidades: [ascensor, porteria, portería, vigilancia, recepcion, recepción, bicicletero]
  luz: [exterior, iluminado, "luz natural", vista, balcon, balcón, ventanal, terraza]
  servicios: ["planta electrica", "planta de emergencia", "planta de energia", "tanque de reserva", "tanque de agua",
              "equipo de presion", hidroflo, "fibra optica"]
  tranquilidad: ["ultimo piso", penthouse, esquinero, "conjunto cerrado", tranquilo, silencioso, insonoriz,
                 "pocos apartamentos"]

avisos:
  umbral: 60                      # puntaje mínimo para avisar por Telegram
  avisar_bajadas_de_precio: true
  margen_fotos: 15                # analizar fotos solo si el puntaje sin fotos está a 15 o menos del umbral
