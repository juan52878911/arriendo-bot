- id: venta_fincaraiz
  descripcion: Apartamentos en venta en los barrios vigilados (config/busquedas.json, una página por barrio), para estimar si podrías comprar
  entidad: Fincaraíz
  tipo: portal
  url: https://www.fincaraiz.com.co/venta/apartamentos/
  tabla: venta
  frecuencia_dias: 30
