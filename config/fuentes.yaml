# Datos abiertos que alimentan el puntaje. `python -m arriendo.ingesta` los descarga y los carga en
# PostGIS. Añadir una fuente es añadir una entrada aquí y, si hace falta, su lector en ingesta.py.

- id: seguridad_sector
  descripcion: Incidentes reportados (hurto, riñas, disparos, porte de armas) por sector catastral, ene-ago de cada año
  entidad: Secretaría Distrital de Seguridad, Convivencia y Justicia
  tipo: arcgis
  url: https://oaiee.scj.gov.co/agc/rest/services/Tematicos_Pub/CifrasSCJ/MapServer/7
  tabla: sector
  frecuencia_dias: 30

- id: delitos_localidad
  descripcion: Delitos de alto impacto por localidad (variación anual)
  entidad: Secretaría Distrital de Seguridad, Convivencia y Justicia
  tipo: arcgis
  url: https://oaiee.scj.gov.co/agc/rest/services/Tematicos_Pub/CifrasSCJ/MapServer/0
  tabla: localidad
  frecuencia_dias: 30

- id: estratos
  descripcion: Estrato socioeconómico por lote; se resume en el estrato dominante de cada sector catastral
  entidad: Secretaría Distrital de Planeación
  tipo: csv_zip
  url: https://datosabiertos.bogota.gov.co/dataset/68ccdaca-5403-4fe6-b727-be01b5d28f15/resource/f1d91324-af38-405e-ad13-026c50448ed1/download/esoc.csv.zip
  tabla: sector
  frecuencia_dias: 90

- id: estaciones_tm
  descripcion: Estaciones troncales de TransMilenio
  entidad: TransMilenio S.A.
  tipo: arcgis
  url: https://gis.transmilenio.gov.co/arcgis/rest/services/Troncal/consulta_estaciones_troncales/MapServer/0
  tabla: estacion_tm
  frecuencia_dias: 90

- id: osm
  descripcion: Vías principales, parques, supermercados y plazas de mercado, ciclorrutas
  entidad: OpenStreetMap (ODbL) vía Overpass
  tipo: overpass
  url: https://overpass-api.de/api/interpreter
  tabla: via, parque, poi, ciclorruta
  frecuencia_dias: 30

- id: upz
  descripcion: Límites de las Unidades de Planeamiento Zonal (UPZ), para unir la Encuesta Multipropósito a cada sector catastral
  entidad: Secretaría Distrital de Planeación
  tipo: arcgis
  url: https://serviciosg.sdp.gov.co/server/rest/services/SERVICIOS_GEOGRAFICOS/DIVISION_FISICA/MapServer/4
  tabla: upz
  frecuencia_dias: 180

# Microdatos de la Encuesta Multipropósito 2021 (1,25 GB, una fila por persona; Latin-1). Se lee en
# streaming y solo se guarda el resumen por UPZ o grupo de UPZ, el nivel más fino que publica.
# No pregunta los años en la vivienda ni si piensa mudarse: se usan las preguntas más cercanas
# (dónde vivía hace 12 meses, año de compra de los propietarios y planes de comprar vivienda).
# EM 2025 se recogió entre oct-2025 y feb-2026; cuando publiquen microdatos basta cambiar url y edicion.
- id: estabilidad_em
  descripcion: Estabilidad residencial por UPZ (tenencia, hogares que llegaron al barrio en el último año, años desde la compra, arrendatarios que planean comprar)
  entidad: Secretaría Distrital de Planeación y DANE, Encuesta Multipropósito
  tipo: csv
  url: https://datosabiertos.bogota.gov.co/dataset/8ac12a95-1415-4812-b343-f07f90608014/resource/b3fd892e-b9f9-4f34-ac22-6cc50612eac9/download/em2021.csv
  diccionario: https://datosabiertos.bogota.gov.co/dataset/8ac12a95-1415-4812-b343-f07f90608014/resource/46ca32a8-0dd3-461e-810a-31781db890f5/download/20230220_diccionario_variables_encuesta_em2021.ods
  edicion: EM 2021
  anio: 2021
  tabla: estabilidad
  frecuencia_dias: 365
  # Grupos de UPZ de la encuesta (hoja Códigos_UPZ del diccionario) → códigos de UPZ de Planeación.
  grupos: {"802": [46, 113], "803": [14, 15, 16], "804": [1, 9, 10], "806": [2, 3, 17], "807": [22, 103],
           "808": [104, 106], "809": [108, 111], "810": [31, 105, 116], "811": [59, 61], "812": [56, 60],
           "813": [115, 117], "814": [91, 93], "815": [63, 64, 68], "816": [90, 99], "817": [88, 97]}

# Consultas por inmueble (no se descargan enteras; solo para candidatos que pasan los filtros):
# - Valor de referencia del suelo por manzana, Catastro Bogotá (2026):
#   https://serviciosgis.catastrobogota.gov.co/arcgis/rest/services/catastro/valorreferencia/MapServer/0
# - Siniestros viales históricos 2015-2021, Secretaría de Movilidad:
#   https://services2.arcgis.com/NEwhEo9GGSHXcRXV/arcgis/rest/services/HistoricoSiniestros/FeatureServer/0

- id: isocrona
  descripcion: Zona desde la que se llega al destino en el tiempo máximo de la búsqueda (llegada 8:15, día hábil)
  entidad: Transitous (GTFS de TransMilenio y SITP)
  tipo: transitous
  url: https://api.transitous.org/api/v6/one-to-all
  tabla: isocrona
  minutos: 45
  frecuencia_dias: 30

- id: aire_pm25
  descripcion: Concentración de PM2.5 promedio anual 2025 por zona (red RMCAB interpolada)
  entidad: Secretaría Distrital de Ambiente
  tipo: arcgis
  url: https://mapas.ambientebogota.gov.co/server/rest/services/Calidad_aire/PM_25_promedio_anual_2025/MapServer/0
  tabla: aire
  frecuencia_dias: 90

# Consulta por inmueble: ruido nocturno, Mapa Estratégico de Ruido 2018-2021 (SDA):
