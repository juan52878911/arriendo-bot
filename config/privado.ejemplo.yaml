# Plantilla de config/privado.yaml (ese archivo no va al repositorio). Copia y ajusta.
# Todo es opcional: lo que no pongas sale de config/config.yaml.

# Adonde vas a diario; el tiempo en transporte público y la zona del mapa se calculan hasta aquí.
destino:
  nombre: Mi trabajo
  lat: 4.6097
  lon: -74.0817

# Filtros: reemplazan clave a clave los de config.yaml. Si defines `ingresos`, el tope sale de ahí.
busqueda:
  habitaciones_min: 2
  banos_min: 1
  tiempo_max_min: 45
  localidades_excluidas: []

# Barrios (sectores catastrales, sin tildes, por prefijo) y localidades que prefieres.
zonas_preferidas:
  sectores: []
  localidades: []

# Pesos propios (deben sumar 100); si no los pones, se usan los de config.yaml.
# pesos: {seguridad: 20, aire_ruido: 15, servicios: 10, estabilidad: 10, zona: 5, tiempo: 10, fotos: 5,
#         precio_m2: 3, area: 5, estrato: 5, cocina: 5, amenidades: 2, entorno: 5, transporte: 0, luz: 0}


vivienda_actual:
  nombre: Tu conjunto actual
  sector_catastral: "000000"       # código del sector catastral donde vives (tabla sector)
  area_m2: 60
  canon_total: 1000000
  parqueadero: false
  servicios: cortes frecuentes de agua   # cómo están hoy agua, luz e internet (texto libre)
  problemas: [inseguridad, ruido de vecinos]

ingresos:
  salario_mensual: 4000000          # bruto (lo usa la estimación de compra)
  neto_mensual: 3700000
  aporte_companero: 0               # lo que pone quien comparte contigo
  pago_comodo: 900000               # tu parte del arriendo con holgura para ahorrar
  pago_max: 1000000                 # cubriendo lo necesario y tus gustos
  pago_limite: 1100000              # recortando gustos; por encima dejas de ahorrar
  escenarios_aporte: [0, 500000, 800000]
  futuro:
    desde: 2027-01
    pago_max: 1200000

presupuesto:
  necesario: {comida: 600000, transporte: 150000, ahorro_minimo: 370000}
  gustos: {ocio: 200000}

lista_corta: []

compra:                             # supuestos para estimar si podrías comprar; verifica la tasa con tu banco
  tasa_efectiva_anual: 12.5
  plazo_anios: 20
  pct_cuota_max_ingreso: 30         # tope habitual de los bancos para la cuota frente al ingreso
  pct_cuota_inicial: 30             # vivienda no VIS
  area_objetivo_m2: 70

# Cuándo vale la pena ir a ver un inmueble frente a donde vives:
veredicto:
  mejora_seguridad_min: 20          # puntos de percentil (más tranquilo que el X % de los sectores)
  area_min_pct: 80                  # al menos el 80 % del área actual
  dimensiones_min: 4                # gana en al menos 4 de las dimensiones comparadas
