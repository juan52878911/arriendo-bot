<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Radar de arriendos</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
  :root { --bg:#f7f6f2; --card:#fff; --text:#22211e; --muted:#6b6962; --line:#e3e1da; --accent:#0f6e56; --warn:#a3562d; }
  @media (prefers-color-scheme: dark) { :root { --bg:#1c1c1a; --card:#262624; --text:#ecebe6; --muted:#a3a19a; --line:#3a3936; --accent:#5dcaa5; --warn:#f0997b; } }
  * { box-sizing: border-box; }
  body { margin:0; font:15px/1.5 system-ui, sans-serif; background:var(--bg); color:var(--text); }
  header { padding:12px 16px; display:flex; gap:12px; align-items:baseline; flex-wrap:wrap; border-bottom:1px solid var(--line); }
  header h1 { font-size:18px; margin:0; font-weight:600; }
  header small { color:var(--muted); }
  main { display:grid; grid-template-columns: minmax(0,1fr) 420px; height: calc(100vh - 53px); }
  #mapa { height:100%; }
  #lista { overflow-y:auto; border-left:1px solid var(--line); padding:8px; }
  .item { background:var(--card); border:1px solid var(--line); border-radius:10px; padding:10px; margin-bottom:8px; display:grid; grid-template-columns:88px 1fr; gap:10px; cursor:pointer; }
  .item.activo { outline:2px solid var(--accent); }
  .item img { width:88px; height:72px; object-fit:cover; border-radius:6px; background:var(--line); }
  .p { font-weight:700; color:var(--accent); }
  .muted { color:var(--muted); font-size:13px; }
  .alerta { color:var(--warn); font-size:13px; }
  details { font-size:13px; margin-top:4px; }
  a { color:var(--accent); }
  label { font-size:13px; color:var(--muted); }
  @media (max-width: 800px) { main { grid-template-columns:1fr; grid-template-rows: 45vh auto; height:auto; } #lista { border-left:0; } }
</style>
</head>
<body>
<header>
  <h1>Radar de arriendos</h1>
  <small id="resumen">cargando…</small>
  <label><input type="checkbox" id="todos"> ver descartados</label>
  <label><input type="checkbox" id="capa" checked> capa de seguridad</label>
</header>
<main>
  <div id="mapa"></div>
  <div id="lista"></div>
</main>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
const mapa = L.map('mapa').setView([4.65, -74.08], 12);
// Mosaicos de OpenStreetMap: sin clave. Su política pide atribución visible y uso moderado.
L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',
  { attribution: '© <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>', maxZoom: 19 }).addTo(mapa);
L.marker([4.5981, -74.0760], { title: 'destino' }).addTo(mapa).bindTooltip('destino');

const peso = n => '$' + Math.round(n).toLocaleString('es-CO');
const color = p => p >= 80 ? '#0f6e56' : p >= 70 ? '#1d9e75' : p >= 55 ? '#ba7517' : '#a32d2d';
let capaSeguridad, marcadores = {};

async function cargarSectores() {
  const g = await (await fetch('api/sectores')).json();
  capaSeguridad = L.geoJSON(g, {
    style: f => { const p = f.properties.seguridad_pct;
      return { weight: 0.3, color: '#888', fillOpacity: 0.25,
               fillColor: p == null ? '#ccc' : `hsl(${120 - 120 * p}, 60%, 45%)` }; },
    onEachFeature: (f, l) => l.bindTooltip(`${f.properties.nombre} · ${f.properties.localidad ?? ''}<br>` +
      `más tranquilo que el ${Math.round(100 - 100 * (f.properties.seguridad_pct ?? 0))}% · estrato ${f.properties.estrato_moda ?? '?'}`)
  });
  if (document.getElementById('capa').checked) capaSeguridad.addTo(mapa);
}

async function cargar() {
  const todos = document.getElementById('todos').checked;
  const datos = await (await fetch('api/inmuebles?todos=' + todos)).json();
  Object.values(marcadores).forEach(m => m.remove()); marcadores = {};
  const lista = document.getElementById('lista'); lista.innerHTML = '';
  document.getElementById('resumen').textContent = `${datos.length} inmuebles ${todos ? '(todos)' : 'que cumplen los filtros'}`;
  for (const i of datos) {
    const descartado = (i.descartes || []).length > 0;
    if (i.lat) {
      marcadores[i.id] = L.circleMarker([i.lat, i.lon], { radius: 8, weight: 1, color: '#fff',
        fillColor: descartado ? '#888' : color(i.puntaje ?? 0), fillOpacity: 0.9 })
        .addTo(mapa).bindTooltip(`${Math.round(i.puntaje ?? 0)} · ${peso(i.total ?? 0)}`)
        .on('click', () => enfocar(i.id));
    }
    const d = document.createElement('div'); d.className = 'item'; d.id = 'i-' + i.id;
    const notas = Object.entries(i.detalle || {}).sort((a, b) => b[1].peso - a[1].peso)
      .map(([k, v]) => `<div>${k}: ${(v.valor * 100).toFixed(0)}% — ${v.nota}</div>`).join('');
    d.innerHTML = `<img loading="lazy" src="${i.foto ?? ''}" alt="">
      <div><span class="p">${i.puntaje == null ? '—' : Math.round(i.puntaje)}</span>
        · ${i.sector_nombre ?? i.barrio_portal ?? ''} <span class="muted">${i.localidad ?? ''}</span><br>
        ${i.total ? peso(i.total) : ''} · ${i.area ?? '?'} m² · ${i.habitaciones ?? '?'} hab / ${i.banos ?? '?'} baños
        ${i.tiempo_min ? ' · ' + i.tiempo_min + ' min' : ''}
        ${(i.alertas || []).map(a => `<div class="alerta">⚠ ${a}</div>`).join('')}
        ${descartado ? `<div class="muted">Descartado: ${i.descartes.join('; ')}</div>` : ''}
        <details><summary>por qué</summary>${notas}</details>
        <a href="${i.url}" target="_blank" rel="noopener">anuncio</a>${i.fredy_url ? ` · <a href="${i.fredy_url}" target="_blank" rel="noopener">Fredy</a>` : ''}
      </div>`;
    d.addEventListener('click', ev => { if (ev.target.tagName !== 'A' && ev.target.tagName !== 'SUMMARY') enfocar(i.id, true); });
    lista.appendChild(d);
  }
  const ancla = decodeURIComponent(location.hash.slice(1)); if (ancla) enfocar(ancla, true);
}

function enfocar(id, mover) {
  document.querySelectorAll('.item.activo').forEach(x => x.classList.remove('activo'));
  const el = document.getElementById('i-' + id); if (el) { el.classList.add('activo'); el.scrollIntoView({ block: 'nearest' }); }
  if (mover && marcadores[id]) { mapa.setView(marcadores[id].getLatLng(), 15); marcadores[id].openTooltip(); }
}

document.getElementById('todos').addEventListener('change', cargar);
document.getElementById('capa').addEventListener('change', e => capaSeguridad && (e.target.checked ? capaSeguridad.addTo(mapa) : capaSeguridad.remove()));
cargarSectores(); cargar();
</script>
</body>
</html>
