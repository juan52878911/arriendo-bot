name: arriendo

services:
  db:
    image: postgis/postgis:17-3.5
    environment:
      POSTGRES_DB: arriendo
      POSTGRES_USER: arriendo
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U arriendo -d arriendo"]
      interval: 10s
      retries: 10
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512M

  scorer:
    build: ./scorer
    environment:
      DATABASE_URL: postgresql://arriendo:${POSTGRES_PASSWORD}@db/arriendo
      ARRIENDO_TOKEN: ${ARRIENDO_TOKEN}
      ARRIENDO_WEB_URL: ${ARRIENDO_WEB_URL:-}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID:-}
      VISION_URL: http://vision:8001
      IMAP_HOST: ${IMAP_HOST:-imap.gmail.com}
      IMAP_USER: ${IMAP_USER:-}
      IMAP_PASSWORD: ${IMAP_PASSWORD:-}
      IMAP_CARPETA: ${IMAP_CARPETA:-INBOX}
    volumes:
      - ./config:/config:ro
      - /data/fotos:/fotos:ro
      - /data/chrono:/chrono:ro       # analisis.json que deja servidor/analisis_chrono.py
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512M

  vision:
    build: ./vision
    environment:
      VISION_HILOS: "3"
      VISION_DISPOSITIVO: auto          # auto: gráfica integrada si está; cpu: forzar CPU
    devices:
      - /dev/dri/renderD128:/dev/dri/renderD128   # Intel UHD 630 de pve, pasada al LXC (dev0)
    # Lo pesado en el NAS de ascci: modelo, cabezas entrenadas y fotos (una por huella).
    volumes:
      - ./config:/config:ro
      - /data/modelos:/modelos
      - /data/fotos:/fotos
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 2G

  fredy:
    # fredy/build.sh prepara este directorio: Fredy fijado a un commit + el portal Fincaraíz.
    build: ./fredy/upstream
    environment:
      ARRIENDO_RAW_URL: http://scorer:8000/raw
      ARRIENDO_TOKEN: ${ARRIENDO_TOKEN}
      FINCARAIZ_MAX_PAGES: ${FINCARAIZ_MAX_PAGES:-2}
      FREDY_BASE_URL: ${FREDY_BASE_URL:-http://IP-DEL-SERVIDOR:9998}
      TZ: America/Bogota
    # Disco local, no el NAS: SQLite sobre NFS corrompe con los bloqueos de WAL.
    volumes:
      - fredy-conf:/conf
      - fredy-db:/db
    ports:
      - "9998:9998"
    depends_on:
      - scorer
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 1G

  respaldo:
    # Copia diaria de PostGIS al NAS de ascci (montado en /data del LXC); guarda 14 días.
    image: postgis/postgis:17-3.5
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - /data/respaldos:/respaldos
    entrypoint: ["sh", "-c"]
    command:
      - |
        while true; do
          pg_dump -h db -U arriendo -Fc arriendo > /respaldos/arriendo-$$(date +%F).dump &&
          find /respaldos -name 'arriendo-*.dump' -mtime +14 -delete
          sleep 86400
        done
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  respaldo-fredy:
    # Copia diaria y consistente (.backup, no cp: la base está en WAL) del SQLite de Fredy: jobs,
    # canales, historial de precios y notas. 14 días en el NAS.
    image: alpine:3.20
    volumes:
      - fredy-db:/db   # sin :ro: leer un SQLite en WAL necesita escribir su archivo -shm
      - /data/respaldos:/respaldos
    entrypoint: ["sh", "-c"]
    command:
      - |
        apk add --no-cache sqlite >/dev/null
        while true; do
          sqlite3 /db/listings.db ".backup /respaldos/fredy-$$(date +%F).db" &&
          find /respaldos -name 'fredy-*.db' -mtime +14 -delete
          sleep 86400
        done
    restart: unless-stopped

volumes:
  pgdata:
  fredy-conf:
  fredy-db:
